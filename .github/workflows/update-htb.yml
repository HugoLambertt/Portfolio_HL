name: Update HTB Activity & Deploy

on:
  schedule:
    - cron: '0 6 * * *'   # Tous les jours à 6h UTC
  workflow_dispatch:       # Déclenchement manuel depuis GitHub Actions

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fetch HTB data
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
          HTB_USER_ID: ${{ secrets.HTB_USER_ID }}
        run: |
          ACTIVITY_STATUS=$(curl -s -o /tmp/htb-activity.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HTB_TOKEN}" \
            -H "User-Agent: Portfolio" \
            -H "Accept: application/json" \
            "https://labs.hackthebox.com/api/v5/user/profile/activity/${HTB_USER_ID}")
          echo "Activity API status: $ACTIVITY_STATUS"
          if [ "$ACTIVITY_STATUS" != "200" ]; then
            echo "--- Activity API Error Response ---"
            cat /tmp/htb-activity.json
            echo "-----------------------------------"
          fi

          CHALLENGE_STATUS=$(curl -s -o /tmp/htb-challenges.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HTB_TOKEN}" \
            -H "User-Agent: Portfolio" \
            -H "Accept: application/json" \
            "https://labs.hackthebox.com/api/v5/user/profile/challenges/solved/${HTB_USER_ID}")
          if [ "$CHALLENGE_STATUS" != "200" ]; then
            CHALLENGE_STATUS=$(curl -s -o /tmp/htb-challenges.json -w "%{http_code}" \
              -H "Authorization: Bearer ${HTB_TOKEN}" \
              -H "User-Agent: Portfolio" \
              -H "Accept: application/json" \
              "https://labs.hackthebox.com/api/v5/user/profile/${HTB_USER_ID}/challenges/solved")
          fi
          echo "Challenges API status: $CHALLENGE_STATUS"
          if [ "$CHALLENGE_STATUS" != "200" ]; then
            echo "--- Challenges API Error Response ---"
            cat /tmp/htb-challenges.json
            echo "-------------------------------------"
          fi

          PROFILE_STATUS=$(curl -s -o /tmp/htb-profile.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HTB_TOKEN}" \
            -H "User-Agent: Portfolio" \
            -H "Accept: application/json" \
            "https://labs.hackthebox.com/api/v4/user/profile/basic/${HTB_USER_ID}")
          echo "Profile API status: $PROFILE_STATUS"
          if [ "$PROFILE_STATUS" != "200" ]; then
            echo "--- Profile API Error Response ---"
            cat /tmp/htb-profile.json
            echo "----------------------------------"
          fi

          # Essai de plusieurs endpoints Sherlock
          for SHERLOCK_PATH in \
            "/api/v5/user/profile/sherlocks/solved/${HTB_USER_ID}" \
            "/api/v5/user/profile/${HTB_USER_ID}/sherlocks/solved" \
            "/api/v5/user/profile/${HTB_USER_ID}/sherlocks" \
            "/api/v4/user/profile/${HTB_USER_ID}/sherlocks/solved" \
            "/api/v4/user/profile/${HTB_USER_ID}/sherlocks" \
            "/api/v4/user/profile/${HTB_USER_ID}/progress/sherlocks" \
            "/api/v4/profile/${HTB_USER_ID}/sherlocks/solved" \
            "/api/v4/profile/${HTB_USER_ID}/sherlocks"; do
            S=$(curl -s -o /tmp/htb-sherlocks.json -w "%{http_code}" \
              -H "Authorization: Bearer ${HTB_TOKEN}" \
              -H "User-Agent: Portfolio" \
              -H "Accept: application/json" \
              "https://labs.hackthebox.com${SHERLOCK_PATH}")
            echo "Sherlocks ${SHERLOCK_PATH}: $S"
            if [ "$S" = "200" ]; then
              echo "  -> $(wc -c < /tmp/htb-sherlocks.json) bytes"
              break
            fi
            rm -f /tmp/htb-sherlocks.json
          done

          # Debug jq — structure de l'activity feed
          echo "=== Activity feed top-level keys ==="
          jq 'keys' /tmp/htb-activity.json 2>/dev/null || true
          echo "=== Activity items (object_type | type | name) ==="
          jq -r '(.profile.activity // .data.activity // .activity // .data // [])[] | "\(.object_type // "?") | \(.type // "?") | \(.name // "?")" ' /tmp/htb-activity.json 2>/dev/null | head -50 || true
          echo "=== Profile sherlock fields ==="
          jq '.profile | with_entries(select(.key | test("sherlock|sheriff"; "i")))' /tmp/htb-profile.json 2>/dev/null || true
          echo "=== Sherlocks file ==="
          if [ -f /tmp/htb-sherlocks.json ]; then
            jq 'keys' /tmp/htb-sherlocks.json 2>/dev/null || true
            jq '(.data // .sherlocks // .profile.sherlock_owns // []) | length' /tmp/htb-sherlocks.json 2>/dev/null || true
            jq '(.data // .sherlocks // .profile.sherlock_owns // []) | .[0:3]' /tmp/htb-sherlocks.json 2>/dev/null || true
          else
            echo "no sherlocks file"
          fi

          if [ "$ACTIVITY_STATUS" != "200" ]; then
            echo "Activity API failed: $ACTIVITY_STATUS — check HTB_TOKEN"
            rm -f /tmp/htb-activity.json /tmp/htb-challenges.json /tmp/htb-sherlocks.json /tmp/htb-profile.json
            exit 1
          fi

      - name: Process & save activity data
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: |
          if [ ! -f /tmp/htb-activity.json ]; then
            echo "Skipping — no fresh data from HTB"
            exit 0
          fi

          node -e "
          const https = require('https');
          const fs    = require('fs');

          const S3 = 'https://htb-mp-prod-public-storage.s3.eu-central-1.amazonaws.com';

          // Résout une URL d'avatar :
          //  - rejette SVG inline et .svg
          //  - convertit les chemins HTB /storage/... en URLs S3 publiques directes
          function resolveAvatar(raw) {
            if (!raw) return null;
            if (typeof raw === 'string' && raw.trim().startsWith('<')) return null;
            if (raw.includes('svg+xml') || raw.toLowerCase().endsWith('.svg')) return null;

            // labs.hackthebox.com/avatars/HASH.png → S3 public (même hash, domaine différent)
            if (raw.includes('labs.hackthebox.com/avatars/')) {
              const filename = raw.split('/avatars/').pop().replace('_thumb', '');
              return filename ? S3 + '/avatars/' + filename : null;
            }
            if (raw.startsWith('http')) return raw.includes('.svg') ? null : raw;

            // Relative avatars path conversion
            if (raw.startsWith('/avatars/')) {
              const filename = raw.split('/avatars/').pop().replace('_thumb', '');
              return filename ? S3 + '/avatars/' + filename : null;
            }

            // Conversion chemins relatifs HTB -> S3 public
            if (raw.startsWith('/storage/avatars/'))
              return S3 + '/avatars/'    + raw.slice('/storage/avatars/'.length);
            if (raw.startsWith('/storage/challenges/'))
              return S3 + '/challenges/' + raw.slice('/storage/challenges/'.length);
            if (raw.startsWith('/storage/sherlocks/'))
              return S3 + '/challenges/' + raw.slice('/storage/sherlocks/'.length);

            // Chemin inconnu — préfixe HTB de secours
            const url = 'https://labs.hackthebox.com' + raw;
            return url.toLowerCase().includes('.svg') ? null : url;
          }

          // Appel GET authentifié — retourne le JSON parsé ou null
          function htbGet(path) {
            return new Promise(resolve => {
              const opts = {
                hostname: 'labs.hackthebox.com',
                path,
                headers: {
                  'Authorization': 'Bearer ' + process.env.HTB_TOKEN,
                  'User-Agent': 'Portfolio',
                  'Accept': 'application/json',
                },
              };
              const req = https.get(opts, res => {
                let body = '';
                res.on('data', d => body += d);
                res.on('end', () => {
                  if (res.statusCode !== 200) {
                    console.log('  [HTTP ' + res.statusCode + '] ' + path.substring(0, 80));
                    resolve(null); return;
                  }
                  try { resolve(JSON.parse(body)); }
                  catch (e) { console.log('  [parse error] ' + path); resolve(null); }
                });
              });
              req.on('error', e => { console.log('  [error] ' + e.message); resolve(null); });
              req.setTimeout(8000, () => { req.destroy(); resolve(null); });
            });
          }

          // Machine : search, puis fallback profile par slug — retourne { avatar, difficulty }
          async function fetchMachineData(name) {
            const search = await htbGet('/api/v4/machine/search?value=' + encodeURIComponent(name));
            const list   = search?.data || [];
            const match  = list.find(m => m.name && m.name.toLowerCase() === name.toLowerCase());
            if (match) {
              const url  = resolveAvatar(match.avatar || match.avatar_thumb || null);
              const diff = match.difficultyText || match.difficulty_text || match.difficulty || null;
              if (url || diff) return { avatar: url, difficulty: diff };
            }
            // Fallback : profil par slug
            const slug    = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            const profile = await htbGet('/api/v4/machine/profile/' + encodeURIComponent(slug));
            const info    = profile?.info || profile?.data || profile;
            if (info && typeof info === 'object') {
              const url  = resolveAvatar(info.avatar || info.avatar_thumb || null);
              const diff = info.difficultyText || info.difficulty_text || info.difficulty || null;
              return { avatar: url, difficulty: diff };
            }
            return { avatar: null, difficulty: null };
          }

          // Sherlock : search par nom
          async function fetchSherlockAvatar(name) {
            const data  = await htbGet('/api/v4/sherlocks?search=' + encodeURIComponent(name));
            const list  = data?.data || [];
            const match = list.find(m => m.name && m.name.toLowerCase() === name.toLowerCase());
            return resolveAvatar(match?.avatar || match?.avatar_thumb || null);
          }

          // Challenge : liste complète puis recherche par nom
          async function fetchChallengeAvatar(name) {
            const data  = await htbGet('/api/v4/challenge/list');
            const list  = data?.challenges || data?.data || [];
            const match = list.find(m => m.name && m.name.toLowerCase() === name.toLowerCase());
            return resolveAvatar(match?.avatar || match?.avatar_thumb || null);
          }

          (async () => {
            // --- Activity (machines + sherlocks) ---
            let rawActivity = {};
            try {
              rawActivity = JSON.parse(fs.readFileSync('/tmp/htb-activity.json', 'utf8'));
            } catch (e) {
              console.error('CRITICAL: Failed to parse /tmp/htb-activity.json as JSON.', e.message);
              console.error('File content sample:', fs.readFileSync('/tmp/htb-activity.json', 'utf8').substring(0, 1000));
              process.exit(1);
            }

            // Debug : afficher la structure brute
            const activityItems = rawActivity.profile?.activity
              || rawActivity.data?.activity
              || rawActivity.activity
              || rawActivity.data
              || [];
            console.log('Activity API structure keys: ' + Object.keys(rawActivity).join(', '));
            console.log('Activity items found: ' + activityItems.length);
            if (activityItems.length > 0) {
              const sample = activityItems[0];
              console.log('Sample item keys: ' + Object.keys(sample).join(', '));
              console.log('Sample item: ' + JSON.stringify(sample).substring(0, 200));
            }

            // Normalise les actions
            const ACTION_LABEL = {
              'root':       'Owned Root',
              'user':       'Owned User',
              'solve':      'Solved',
              'challenge':  'Solved',
              'sherlock':   'Solved',
              'Owned Root': 'Owned Root',
              'Owned User': 'Owned User',
              'Solved':     'Solved',
            };
            const ACTION_RANK = { 'Owned Root': 3, 'root': 3, 'Solved': 2, 'solve': 2, 'challenge': 2, 'sherlock': 2, 'Owned User': 1, 'user': 1 };

            const best = new Map();
            for (const item of activityItems) {
              let objType = item.object_type || item.type_name || item.type || 'machine';
              if (objType === 'root' || objType === 'user') objType = 'machine';
              const key  = objType + ':' + item.name;
              const rank = ACTION_RANK[item.type] ?? 0;
              if (!best.has(key) || rank > best.get(key).rank)
                best.set(key, { rank, item, objType });
            }

            const activities = [...best.values()]
              .sort((a, b) => {
                const dateA = new Date(a.item.date ?? a.item.created_at ?? a.item.solved_at ?? a.item.time ?? 0);
                const dateB = new Date(b.item.date ?? b.item.created_at ?? b.item.solved_at ?? b.item.time ?? 0);
                return dateB - dateA;
              })
              .map(({ item, objType }) => ({
                name:       item.name,
                type:       objType,
                action:     ACTION_LABEL[item.type] ?? item.type ?? 'Completed',
                difficulty: item.difficulty         ?? null,
                category:   item.challenge_category ?? item.category ?? null,
                date:       item.date ?? item.created_at ?? item.solved_at ?? item.time ?? new Date().toISOString(),
                points:     item.points             ?? 0,
                avatar:     resolveAvatar(item.machine_avatar || item.sherlock_avatar || item.avatar || item.challenge_avatar || null),
              }));

            // --- Challenges résolus (endpoint séparé) ---
            if (fs.existsSync('/tmp/htb-challenges.json')) {
              try {
                const rawChallenges = JSON.parse(fs.readFileSync('/tmp/htb-challenges.json', 'utf8'));
                const solved = rawChallenges?.profile?.challenge_owns
                  || rawChallenges?.data
                  || rawChallenges?.challenges
                  || [];
                console.log('Challenges API retourne ' + solved.length + ' entries');
                for (const ch of solved) {
                  const key = 'challenge:' + ch.name;
                  if (!best.has(key)) {
                    activities.push({
                      name:       ch.name,
                      type:       'challenge',
                      action:     'Solved',
                      difficulty: ch.difficulty ?? null,
                      category:   ch.category_name ?? ch.category ?? null,
                      date:       ch.solved_at ?? ch.created_at ?? ch.date ?? new Date().toISOString(),
                      points:     ch.points ?? 0,
                      avatar:     resolveAvatar(ch.avatar || ch.avatar_thumb || null),
                    });
                    best.set(key, true);
                  }
                }
                activities.sort((a, b) => new Date(b.date) - new Date(a.date));
              } catch (e) {
                console.log('Challenges parse error: ' + e.message);
              }
            }

            // --- Sherlocks résolus (endpoint séparé) ---
            if (fs.existsSync('/tmp/htb-sherlocks.json')) {
              try {
                const rawSherlocks = JSON.parse(fs.readFileSync('/tmp/htb-sherlocks.json', 'utf8'));
                console.log('Sherlocks API top-level keys: ' + Object.keys(rawSherlocks).join(', '));
                const solved = rawSherlocks?.profile?.sherlock_owns
                  || rawSherlocks?.data
                  || rawSherlocks?.sherlocks
                  || [];
                console.log('Sherlocks API retourne ' + solved.length + ' entries');
                for (const sh of solved) {
                  const key = 'sherlock:' + sh.name;
                  if (!best.has(key)) {
                    activities.push({
                      name:       sh.name,
                      type:       'sherlock',
                      action:     'Solved',
                      difficulty: sh.difficulty ?? null,
                      category:   sh.category_name ?? sh.category ?? null,
                      date:       sh.solved_at ?? sh.completed_at ?? sh.created_at ?? sh.date ?? new Date().toISOString(),
                      points:     sh.points ?? 0,
                      avatar:     resolveAvatar(sh.avatar || sh.avatar_thumb || sh.image || null),
                    });
                    best.set(key, true);
                  }
                }
                activities.sort((a, b) => new Date(b.date) - new Date(a.date));
              } catch (e) {
                console.log('Sherlocks parse error: ' + e.message);
              }
            }

            // --- Enrichissement des avatars manquants ou non-S3 ---
            const missing = activities.filter(a =>
              !a.avatar || a.avatar.includes('labs.hackthebox.com') ||
              (a.type === 'machine' && !a.difficulty)
            );
            console.log('Avatars a enrichir : ' + missing.length + '/' + activities.length);

            for (const act of missing) {
              await new Promise(r => setTimeout(r, 350));
              if (act.type === 'machine') {
                const data = await fetchMachineData(act.name);
                act.avatar = data.avatar;
                if (data.difficulty && !act.difficulty) act.difficulty = data.difficulty;
              } else if (act.type === 'sherlock') {
                act.avatar = await fetchSherlockAvatar(act.name);
              } else if (act.type === 'challenge') {
                act.avatar = await fetchChallengeAvatar(act.name);
              }

              const diff   = act.difficulty ? (' diff=' + act.difficulty) : '';
              const status = act.avatar ? ('OK -> ' + act.avatar) : 'introuvable';
              console.log('  ' + act.name + ' (' + act.type + ')' + diff + ': ' + status);
            }

            const found = activities.filter(a => a.avatar).length;
            console.log('Avatars resolus : ' + found + '/' + activities.length);

            // --- Profile stats ---
            let stats = null;
            if (fs.existsSync('/tmp/htb-profile.json')) {
              try {
                const rawProfile = JSON.parse(fs.readFileSync('/tmp/htb-profile.json', 'utf8'));
                const p = rawProfile.profile ?? rawProfile.data ?? rawProfile ?? {};
                stats = {
                  name:           p.name           ?? null,
                  rank:           p.ranking        ?? null,
                  rank_text:      p.rank           ?? null,
                  points:         p.points         ?? 0,
                  root_owns:      p.root_owns      ?? 0,
                  user_owns:      p.user_owns      ?? 0,
                  challenge_owns: p.challenge_owns ?? 0,
                  sherlock_owns:  p.sheriff_owns   ?? p.sherlock_owns ?? 0,
                  respects:       p.respects       ?? 0,
                  avatar:         resolveAvatar(p.avatar),
                };
              } catch (e) {
                console.error('WARNING: Failed to parse /tmp/htb-profile.json as JSON.', e.message);
                if (fs.existsSync('/tmp/htb-profile.json')) {
                  console.error('File content sample:', fs.readFileSync('/tmp/htb-profile.json', 'utf8').substring(0, 1000));
                }
              }
            }

            const result = { stats, activities, updated_at: new Date().toISOString() };
            fs.writeFileSync('public/htb-activity.json', JSON.stringify(result, null, 2));
            console.log('Saved ' + activities.length + ' activities | stats: ' + !!stats);
          })().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Commit updated activity data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/htb-activity.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update HTB activity [skip ci]" && git push

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
