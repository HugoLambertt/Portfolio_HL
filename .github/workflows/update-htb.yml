name: Update HTB Activity & Deploy

on:
  schedule:
    - cron: '0 6 * * *'   # Tous les jours à 6h UTC
  workflow_dispatch:       # Déclenchement manuel depuis GitHub Actions

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fetch HTB data
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
          HTB_USER_ID: ${{ secrets.HTB_USER_ID }}
        run: |
          ACTIVITY_STATUS=$(curl -s -o /tmp/htb-activity.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HTB_TOKEN}" \
            -H "User-Agent: Portfolio" \
            -H "Accept: application/json" \
            "https://labs.hackthebox.com/api/v4/profile/activity/${HTB_USER_ID}")
          echo "Activity API (machines/sherlocks): $ACTIVITY_STATUS"

          CHALLENGE_STATUS=$(curl -s -o /tmp/htb-challenges.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HTB_TOKEN}" \
            -H "User-Agent: Portfolio" \
            -H "Accept: application/json" \
            "https://labs.hackthebox.com/api/v4/profile/${HTB_USER_ID}/challenges/solved")
          echo "Challenges API: $CHALLENGE_STATUS"

          PROFILE_STATUS=$(curl -s -o /tmp/htb-profile.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HTB_TOKEN}" \
            -H "User-Agent: Portfolio" \
            -H "Accept: application/json" \
            "https://labs.hackthebox.com/api/v4/profile/${HTB_USER_ID}")
          echo "Profile API: $PROFILE_STATUS"

          if [ "$ACTIVITY_STATUS" != "200" ]; then
            echo "⚠️ Activity API returned $ACTIVITY_STATUS — existing data will be kept"
            rm -f /tmp/htb-activity.json /tmp/htb-challenges.json /tmp/htb-profile.json
          else
            echo "✅ HTB data fetched successfully"
          fi

      - name: Process & save activity data
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: |
          if [ ! -f /tmp/htb-activity.json ]; then
            echo "Skipping — no fresh data from HTB"
            exit 0
          fi

          node -e "
          const https = require('https');
          const fs    = require('fs');

          const S3 = 'https://htb-mp-prod-public-storage.s3.eu-central-1.amazonaws.com';

          // Résout une URL d'avatar :
          //  - rejette SVG inline et .svg
          //  - convertit les chemins HTB /storage/... en URLs S3 publiques directes
          function resolveAvatar(raw) {
            if (!raw) return null;
            if (typeof raw === 'string' && raw.trim().startsWith('<')) return null;
            if (raw.includes('svg+xml') || raw.toLowerCase().endsWith('.svg')) return null;

            if (raw.startsWith('http')) return raw.includes('.svg') ? null : raw;

            // Conversion chemins relatifs HTB -> S3 public
            if (raw.startsWith('/storage/avatars/'))
              return S3 + '/avatars/'    + raw.slice('/storage/avatars/'.length);
            if (raw.startsWith('/storage/challenges/'))
              return S3 + '/challenges/' + raw.slice('/storage/challenges/'.length);
            if (raw.startsWith('/storage/sherlocks/'))
              return S3 + '/challenges/' + raw.slice('/storage/sherlocks/'.length);

            // Chemin inconnu — préfixe HTB de secours
            const url = 'https://labs.hackthebox.com' + raw;
            return url.toLowerCase().includes('.svg') ? null : url;
          }

          // Appel GET authentifié — retourne le JSON parsé ou null
          function htbGet(path) {
            return new Promise(resolve => {
              const opts = {
                hostname: 'labs.hackthebox.com',
                path,
                headers: {
                  'Authorization': 'Bearer ' + process.env.HTB_TOKEN,
                  'User-Agent': 'Portfolio',
                  'Accept': 'application/json',
                },
              };
              const req = https.get(opts, res => {
                let body = '';
                res.on('data', d => body += d);
                res.on('end', () => {
                  if (res.statusCode !== 200) {
                    console.log('  [HTTP ' + res.statusCode + '] ' + path.substring(0, 80));
                    resolve(null); return;
                  }
                  try { resolve(JSON.parse(body)); }
                  catch (e) { console.log('  [parse error] ' + path); resolve(null); }
                });
              });
              req.on('error', e => { console.log('  [error] ' + e.message); resolve(null); });
              req.setTimeout(8000, () => { req.destroy(); resolve(null); });
            });
          }

          // Machine : search, puis fallback profile par slug
          async function fetchMachineAvatar(name) {
            const search = await htbGet('/api/v4/machine/search?value=' + encodeURIComponent(name));
            const list   = search?.data || [];
            const match  = list.find(m => m.name && m.name.toLowerCase() === name.toLowerCase());
            if (match) {
              const url = resolveAvatar(match.avatar || match.avatar_thumb || null);
              if (url) return url;
            }
            // Fallback : profil par slug (ex: 'wingdata')
            const slug    = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            const profile = await htbGet('/api/v4/machine/profile/' + encodeURIComponent(slug));
            const info    = profile?.info || profile?.data || profile;
            if (info && typeof info === 'object') {
              const url = resolveAvatar(info.avatar || info.avatar_thumb || null);
              if (url) return url;
            }
            return null;
          }

          // Sherlock : search par nom
          async function fetchSherlockAvatar(name) {
            const data  = await htbGet('/api/v4/sherlocks?search=' + encodeURIComponent(name));
            const list  = data?.data || [];
            const match = list.find(m => m.name && m.name.toLowerCase() === name.toLowerCase());
            return resolveAvatar(match?.avatar || match?.avatar_thumb || null);
          }

          // Challenge : liste complète puis recherche par nom
          async function fetchChallengeAvatar(name) {
            const data  = await htbGet('/api/v4/challenge/list');
            const list  = data?.challenges || data?.data || [];
            const match = list.find(m => m.name && m.name.toLowerCase() === name.toLowerCase());
            return resolveAvatar(match?.avatar || match?.avatar_thumb || null);
          }

          (async () => {
            // --- Activity (machines + sherlocks) ---
            const rawActivity = JSON.parse(fs.readFileSync('/tmp/htb-activity.json', 'utf8'));

            // Normalise les actions (ancienne API : Owned Root, nouvelle : root)
            const ACTION_LABEL = {
              'root':       'Owned Root',
              'user':       'Owned User',
              'solve':      'Solved',
              'challenge':  'Solved',
              'sherlock':   'Solved',
              'Owned Root': 'Owned Root',
              'Owned User': 'Owned User',
              'Solved':     'Solved',
            };
            const ACTION_RANK = { 'Owned Root': 3, 'root': 3, 'Solved': 2, 'solve': 2, 'challenge': 2, 'sherlock': 2, 'Owned User': 1, 'user': 1 };

            const best = new Map();
            for (const item of (rawActivity.profile?.activity || [])) {
              const key  = item.object_type + ':' + item.name;
              const rank = ACTION_RANK[item.type] ?? 0;
              if (!best.has(key) || rank > best.get(key).rank)
                best.set(key, { rank, item });
            }

            const activities = [...best.values()]
              .sort((a, b) => new Date(b.item.date) - new Date(a.item.date))
              .map(({ item }) => ({
                name:       item.name,
                type:       item.object_type,
                action:     ACTION_LABEL[item.type] ?? item.type ?? 'Completed',
                difficulty: item.difficulty         ?? null,
                category:   item.challenge_category ?? null,
                date:       item.date,
                points:     item.points             ?? 0,
                avatar:     resolveAvatar(item.machine_avatar || item.avatar || item.challenge_avatar || null),
              }));

            // --- Challenges résolus (endpoint séparé) ---
            if (fs.existsSync('/tmp/htb-challenges.json')) {
              try {
                const rawChallenges = JSON.parse(fs.readFileSync('/tmp/htb-challenges.json', 'utf8'));
                const solved = rawChallenges?.profile?.challenge_owns
                  || rawChallenges?.data
                  || rawChallenges?.challenges
                  || [];
                console.log('Challenges API retourne ' + solved.length + ' entries');
                for (const ch of solved) {
                  const key = 'challenge:' + ch.name;
                  if (!best.has(key)) {
                    activities.push({
                      name:       ch.name,
                      type:       'challenge',
                      action:     'Solved',
                      difficulty: ch.difficulty ?? null,
                      category:   ch.category_name ?? ch.category ?? null,
                      date:       ch.solved_at ?? ch.created_at ?? ch.date ?? new Date().toISOString(),
                      points:     ch.points ?? 0,
                      avatar:     resolveAvatar(ch.avatar || ch.avatar_thumb || null),
                    });
                    best.set(key, true);
                  }
                }
                // Re-trier après ajout des challenges
                activities.sort((a, b) => new Date(b.date) - new Date(a.date));
              } catch (e) {
                console.log('Challenges parse error: ' + e.message);
              }
            }

            // --- Enrichissement des avatars manquants ---
            const missing = activities.filter(a => !a.avatar);
            console.log('Avatars manquants : ' + missing.length + '/' + activities.length);

            for (const act of missing) {
              await new Promise(r => setTimeout(r, 350));
              if      (act.type === 'machine')   act.avatar = await fetchMachineAvatar(act.name);
              else if (act.type === 'sherlock')  act.avatar = await fetchSherlockAvatar(act.name);
              else if (act.type === 'challenge') act.avatar = await fetchChallengeAvatar(act.name);

              const status = act.avatar ? ('OK -> ' + act.avatar) : 'introuvable';
              console.log('  ' + act.name + ' (' + act.type + '): ' + status);
            }

            const found = activities.filter(a => a.avatar).length;
            console.log('Avatars resolus : ' + found + '/' + activities.length);

            // --- Profile stats ---
            let stats = null;
            if (fs.existsSync('/tmp/htb-profile.json')) {
              const rawProfile = JSON.parse(fs.readFileSync('/tmp/htb-profile.json', 'utf8'));
              const p = rawProfile.profile ?? {};
              stats = {
                name:           p.name           ?? null,
                rank:           p.ranking        ?? null,
                rank_text:      p.rank           ?? null,
                points:         p.points         ?? 0,
                root_owns:      p.root_owns      ?? 0,
                user_owns:      p.user_owns      ?? 0,
                challenge_owns: p.challenge_owns ?? 0,
                sherlock_owns:  p.sheriff_owns   ?? p.sherlock_owns ?? 0,
                respects:       p.respects       ?? 0,
                avatar:         resolveAvatar(p.avatar),
              };
            }

            const result = { stats, activities, updated_at: new Date().toISOString() };
            fs.writeFileSync('public/htb-activity.json', JSON.stringify(result, null, 2));
            console.log('Saved ' + activities.length + ' activities | stats: ' + !!stats);
          })().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Commit updated activity data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/htb-activity.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update HTB activity [skip ci]" && git push

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
